# Shared by the two .NET services, merged in with `<<: *dotnet-env` - which is why
# their `environment:` is map form, not list form. SCYLLA_PRIVATE_IP is empty in
# single-host dev, so the default keeps them on the compose-network service name.
x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  Scylla__ContactPoints__0: ${SCYLLA_PRIVATE_IP:-ffmt_scylla_node}
  Redis__Host: ffmt_redis
  Redis__Port: "6379"
  FfmtLogging__LogDirectory: /app/logs
  # Ffmt.Cli ships no appsettings.json, so `docker exec ffmt_backend ffmt ...` only sees these.
  Universalis__RegionsToUse__0: Europe
  Universalis__RegionsToUse__1: North-America
  Quarantine__ShadowMode: ${Quarantine__ShadowMode}
  Quarantine__MedianMultiplier: ${Quarantine__MedianMultiplier}

services:

  ffmt_backend:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/Dockerfile_backend
    image: ffmt_backend
    container_name: ffmt_backend
    restart: "always"
    depends_on:
      - ffmt_elastic
      - ffmt_redis
    environment:
      <<: *dotnet-env
      Elastic__Url: http://ffmt_elastic:9200
      Archive__Endpoint: ${Archive__Endpoint}
      Archive__Bucket: ${Archive__Bucket}
      Archive__AccessKey: ${Archive__AccessKey}
      Archive__SecretKey: ${Archive__SecretKey}
    volumes:
      - ./logs/backend:/app/logs

  ffmt_frontend:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/Dockerfile_frontend
      args:
        VITE_API_BASE_URL: /api/v1
    image: ffmt_frontend
    restart: unless-stopped

  ffmt_proxy:
    container_name: ffmt_proxy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ZERO_SSL_USER_EMAIL=${ZERO_SSL_USER_EMAIL}
      - ZERO_SSL_MAIN_DOMAIN=${ZERO_SSL_MAIN_DOMAIN}
      - ZERO_SSL_MONITORING_DOMAIN=${ZERO_SSL_MONITORING_DOMAIN}
    depends_on:
      - ffmt_frontend
      - ffmt_backend

  ffmt_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    deploy:
      resources:
        limits:
          memory: 384m

  ffmt_scylla_node:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/Dockerfile_scylla
    image: ffmt_scylla
    profiles: ["scylla"]
    restart: "unless-stopped"
    # Host ports are published only by docker-compose.scylla-vm.yml. Compose
    # appends port lists, so publishing here would leak Scylla to the public NIC
    # and collide with both node_exporter's :9100 and the override's bindings.
    volumes:
      - ./docker/scylla/persistent/data:/var/lib/scylla
      - ./docker/scylla/persistent/commitlog:/var/lib/scylla/commitlog
      - ./docker/scylla/persistent/saved_caches:/var/lib/scylla/saved_caches
      - ./docker/scylla/persistent/log:/var/log/scylla
      - ./docker/scylla/etc/scylla/scylla.yaml:/etc/scylla/scylla.yaml
      - ./docker/scylla/usr/local/bin:/usr/local/bin
      - ./scripts/cql/schema:/startup_scripts
    deploy:
      resources:
        limits:
          memory: 6g

  ffmt_elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.0
    restart: "unless-stopped"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1g

  ffmt_ws_worker:
    build:
      context: .
      dockerfile: ./docker/ws_worker/Dockerfile
    image: ffmt_ws_worker
    restart: always
    depends_on:
      - ffmt_redis
    environment:
      <<: *dotnet-env
    volumes:
      - ./logs/ws_worker:/app/logs

  ffmt_node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ffmt_node_exporter
    profiles: ["host_metrics"]
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--web.listen-address=${HOST_PRIVATE_IP:-127.0.0.1}:9100"
    volumes:
      - "/:/host:ro,rslave"

networks:
  # Named explicitly because the monitoring stack joins it as an external network.
  default:
    name: ffmt_network
    driver: bridge

volumes:
  # Holds Caddy's ACME state, so certs aren't re-issued on every recreate.
  caddy_data:
  caddy_config:
  # Without this the items index sits in the container layer and dies on recreate.
  elastic_data:
