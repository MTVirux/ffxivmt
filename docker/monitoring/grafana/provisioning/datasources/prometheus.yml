apiVersion: 1

# Drops the older auto-UID datasource so the pinned-UID one below is the sole default.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # Lowercase name plus pinned UID so both legacy string refs and modern UID refs resolve.
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://ffmt_prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
