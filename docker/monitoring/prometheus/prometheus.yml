# Targets are split across three files so the rendered/ subdir (private IPs) can be
# gitignored while the .tpl templates stay committed.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ffmt
    monitor: ffmt-mon

scrape_configs:

  - job_name: scylla
    file_sd_configs:
      - files: [/etc/prometheus/rendered/scylla_servers.yml]

  - job_name: node_exporter
    file_sd_configs:
      - files: [/etc/prometheus/rendered/node_exporter_servers.yml]

  # Not under rendered/: docker network DNS needs no envsubst.
  - job_name: ffmt
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/ffmt_servers.yml]
