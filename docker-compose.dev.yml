services:
  ffmt_backend:
    build:
      dockerfile: ./docker/dockerfiles/Dockerfile_backend_dev
    image: ffmt_backend_dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./backend:/src/backend

  ffmt_frontend:
    build:
      # runtime stage has no pnpm
      target: build
    command: pnpm dev --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so a host node_modules can't shadow the container's install.
      - /app/node_modules
